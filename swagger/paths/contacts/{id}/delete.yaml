tags:
  - Contacts
summary: Delete a contact by id
operationId: deleteContact
description: Deletes a contact by its unique ID if it belongs to the authenticated user.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: 686657d0779bb634b920424e
    description: The unique identifier of the contact
responses:
  '204':
    description: Contact successfully deleted. No content is returned.
  '404':
    $ref: ../../../components/responses/404.yaml
