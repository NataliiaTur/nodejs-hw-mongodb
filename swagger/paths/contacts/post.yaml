tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: 'Creates a new contact and assigns it to the currently authenticated user'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'Andre'
          phoneNumber:
            type: string
            example: 380991234444
          email:
            type: string
            example: andrii@ukr.net
          isFavorite:
            type: boolean
            example: false
          contactType:
            type: string
            enum: [work, home, personal]
            example: work
          photo:
            description: "Student's photo"
            type: string
            format: binary
responses:
  '201':
    description: Contact successfully created
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created contact!
            data:
              type: object
              $ref: ../../components/schemas/contact.yaml
  '401':
    $ref: '../../components/responses/401.yaml'
  '400':
    $ref: ../../components/responses/400.yaml
