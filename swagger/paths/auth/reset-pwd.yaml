/auth/reset-pwd:
  post:
    tags:
      - Auth
    summary: Reset password
    operationId: resetPassword
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/auth/resetPassword.yaml
    responses:
      '200':
        description: Password successfully reset
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Password has been reset
